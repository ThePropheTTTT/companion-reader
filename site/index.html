<!doctype html>
<html lang="zh-CN" data-theme="paper" data-chrome="light" data-device="phone" data-font="song">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 是吃 env(safe-area-inset-*) 的前提 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>陪读</title>
    <meta name="description" content="有人陪着读书的 AI 阅读器。导入 EPUB，陪你叽叽喳喳。" />

    <!-- iOS 加主屏幕后全屏运行 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="陪读" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c20" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" href="./icons/icon-192.png" />

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/library.css" />
    <link rel="stylesheet" href="./css/reader.css" />
    <link rel="stylesheet" href="./css/panel.css" />
    <link rel="stylesheet" href="./css/notes.css" />
    <link rel="stylesheet" href="./css/danmaku.css" />
    <link rel="stylesheet" href="./css/chat.css" />
  </head>
  <body>
    <div id="app">
      <!-- ================= 顶栏 ================= -->
      <header class="topbar" id="topbar">
        <button class="iconbtn" id="btn-back" type="button" hidden aria-label="返回书架">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M12.5 4.5 7 10l5.5 5.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button class="iconbtn" id="btn-rail" type="button" hidden aria-label="目录">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M3.5 5.5h13M3.5 10h13M3.5 14.5h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <div class="topbar__title" id="topbar-title">陪读</div>

        <button class="iconbtn" id="btn-read-settings" type="button" hidden aria-label="排版设置">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M4 6.5h6M14 6.5h2M4 13.5h2M10 13.5h6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
            <circle cx="12" cy="6.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
            <circle cx="8" cy="13.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>

        <button class="iconbtn" id="btn-ai" type="button" hidden aria-label="AI 设置">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 2.8l1.7 4.1 4.1 1.7-4.1 1.7L10 14.4 8.3 10.3 4.2 8.6l4.1-1.7z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button class="iconbtn" id="btn-import" type="button" aria-label="导入书籍" hidden>
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M10 3.5v9M6.2 9l3.8 3.8L13.8 9M4 16h12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </header>

      <!-- ================= 主区 ================= -->
      <main class="main" id="main">
        <!-- 书架 -->
        <section class="view" id="view-library" aria-label="书架">
          <div class="library" id="library"></div>
        </section>

        <!-- 阅读器（外壳固定，内部由 js/ui/reader.js 填充） -->
        <section class="view" id="view-reader" hidden aria-label="阅读">
          <div class="reader" id="reader">
            <aside class="rail" id="rail" aria-label="目录">
              <div class="rail__head">
                <span class="rail__title" id="rail-title">目录</span>
                <button class="iconbtn" id="btn-rail-close" type="button" aria-label="收起">
                  <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
                    <path
                      d="M6 6l8 8M14 6l-8 8"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
              </div>
              <div class="rail__body" id="rail-body"></div>
            </aside>

            <div class="pages" id="pages">
              <div class="paper" id="paper">
                <div class="page-scroll" id="page-scroll">
                  <div class="page-body" id="page-body"></div>
                </div>
                <button class="tapzone tapzone--prev" id="tap-prev" type="button" aria-label="上一页"></button>
                <button class="tapzone tapzone--next" id="tap-next" type="button" aria-label="下一页"></button>
                <button class="pager pager--prev" id="pager-prev" type="button" aria-label="上一页">
                  <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
                    <path
                      d="M12.5 4.5 7 10l5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <button class="pager pager--next" id="pager-next" type="button" aria-label="下一页">
                  <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
                    <path
                      d="M7.5 4.5 13 10l-5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>

                <!-- 弹幕层：盖在正文上方，不参与分页测量 -->
                <div class="danmaku-layer" id="danmaku-layer" aria-hidden="true"></div>
              </div>

              <div class="pagefoot">
                <span class="pagefoot__chapter" id="foot-chapter"></span>
                <span class="pagefoot__num" id="foot-num"></span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- ================= 底栏（仅阅读时显示）================= -->
      <footer class="bottombar" id="bottombar" hidden>
        <button class="iconbtn" id="btn-toc-mobile" type="button" aria-label="目录">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M3.5 5.5h13M3.5 10h13M3.5 14.5h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>

        <button class="bottombar__primary" id="btn-companion" type="button">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M3.5 5.2A1.7 1.7 0 0 1 5.2 3.5h9.6a1.7 1.7 0 0 1 1.7 1.7v6.1a1.7 1.7 0 0 1-1.7 1.7H8.3L4.6 16.4a.6.6 0 0 1-1.1-.4z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
          <span id="companion-label">书搭子</span>
        </button>

        <button class="iconbtn" id="btn-notes" type="button" aria-label="批注">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M4.5 3.5h11v13l-5.5-3-5.5 3z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button class="iconbtn" id="btn-danmaku" type="button" aria-label="弹幕" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M3 5.5h9M3 9h6M3 12.5h11"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <circle cx="15" cy="13.6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>
      </footer>
    </div>

    <!-- 浮层容器：面板 / 书搭子 / 目录抽屉 -->
    <div id="overlay-root"></div>

    <!-- 吐司 -->
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <!-- 全局拖放层 -->
    <div class="dropzone" id="dropzone" hidden>松手就导入</div>

    <!-- 隐藏的导入 input -->
    <input
      type="file"
      id="file-input"
      accept=".epub,.txt,application/epub+zip,text/plain"
      multiple
      hidden
    />

    <!-- 启动失败兜底：模块加载不了（老 Safari / file://）时说清楚原因 -->
    <noscript>
      <div class="empty">
        <p class="empty__title">需要开启 JavaScript</p>
        <p class="empty__body">陪读在本地解析你的书，必须有 JS 才能运行。</p>
      </div>
    </noscript>

    <script type="module" src="./js/app.js"></script>
    <script>
      // 模块没跑起来（老浏览器不支持 / 从 file:// 直接打开）时的兜底提示。
      // app.js 成功启动后会设 window.__peiduBooted = true。
      setTimeout(function () {
        if (!window.__peiduBooted) {
          var app = document.getElementById('app');
          if (app && !app.dataset.fallbackShown) {
            app.dataset.fallbackShown = '1';
            app.insertAdjacentHTML(
              'afterbegin',
              '<div class="empty"><p class="empty__title">没能启动</p>' +
                '<p class="empty__body">请用较新的 Safari（16.4 以上）打开，' +
                '并且不要直接双击 HTML 文件——需要通过网址访问（开发时用 npm run dev，' +
                '部署后用自己的域名或 Cloudflare Pages 地址）。</p></div>'
            );
          }
        }
      }, 2500);
    </script>
  </body>
</html>
